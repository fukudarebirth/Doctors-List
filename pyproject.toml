[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rebirth-doctors-list"
version = "0.2.0"
description = "Doctor-list reconciliation, approved appends and Windows desktop UI"
requires-python = ">=3.11"
dependencies = [
  "google-api-python-client>=2.160,<3",
  "google-auth>=2.37,<3",
  "google-auth-oauthlib>=1.2,<2",
  "tzdata>=2025.1"
]

[project.scripts]
doctors-list = "doctors_list.cli:main"

[project.gui-scripts]
doctors-list-gui = "doctors_list.gui:main"

[tool.setuptools.packages.find]
include = ["doctors_list*"]
