[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rebirth-doctors-list"
version = "0.1.1"
description = "Read-only doctor-list reconciliation and dry-run planning"
requires-python = ">=3.11"
dependencies = [
  "google-api-python-client>=2.160,<3",
  "google-auth>=2.37,<3",
  "google-auth-oauthlib>=1.2,<2",
  "tzdata>=2025.1"
]

[project.scripts]
doctors-list = "doctors_list.cli:main"

[tool.setuptools.packages.find]
include = ["doctors_list*"]
